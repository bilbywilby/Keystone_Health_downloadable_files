name: Medical Debt CMS CI

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography python-dateutil flake8

      - name: Run linter
        run: |
          flake8 scripts tests

      - name: Run unit tests
        run: |
          pytest -q --cov=medical_debt_cms tests/

      - name: Dry-run dispatcher (no network)
        env:
          DISPATCH_WEBHOOK_URL: "https://nonexistent.example.com/dispatch"
          HMAC_SECRET: "dev-secret"
          LEDGER_ENC_KEY: "dev-placeholder"
        run: |
          python scripts/dispatch_work_orders.py --dry-run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Archive logs
        run: tar czvf artifacts/logs.tar.gz output/*
